[package]
name = "githubuploader"
version = "0.1.0"
edition = "2024"
description = "Desktop app that publishes claude-stuff projects to GitHub, with Claude as a helper"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow"] }
ignore = "0.4.33"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
strip = true

[build-dependencies]
winresource = "0.1"
